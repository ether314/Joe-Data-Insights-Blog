# Extension field holds the worker service template (Compose ignores x-* keys).
x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile.worker
  image: data-insights-blog-worker:local
  profiles: ["workers"]
  working_dir: /workspace
  init: true
  restart: unless-stopped
  command: ["sleep", "infinity"]
  environment:
    NEXT_TELEMETRY_DISABLED: "1"
    BLOG_IN_DOCKER: "1"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    image: data-insights-blog:local
    container_name: data-insights-blog
    ports:
      - "${BLOG_PORT:-3000}:80"
    restart: unless-stopped

  # Hot-reload Next.js dev server (sample data; Firebase optional)
  # Usage: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - blog_node_modules:/app/node_modules
    ports:
      - "${BLOG_DEV_PORT:-3000}:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID:-}
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    command: sh -c "npm ci --ignore-scripts && npm run dev -- --hostname 0.0.0.0 --port 3000"

  # Isolated conveyor workers. Start with:
  #   npm run automation:start
  #   or: npm run workers:up
  # Each service bind-mounts ONLY its own clone (BLOG_WORKER_HOST_ROOT/worker-N).
  # Never mount the main checkout RW. Do not `docker compose down` (that would
  # stop `web`); use `npm run workers:stop` / stop-blog-automation.ps1.
  worker-1:
    <<: *worker
    container_name: blog-worker-1
    hostname: blog-worker-1
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      BLOG_IN_DOCKER: "1"
      BLOG_WORKER_ID: "1"
    volumes:
      - type: bind
        source: ${BLOG_WORKER_HOST_ROOT:?Set BLOG_WORKER_HOST_ROOT (npm run workers:up sets this)}/worker-1
        target: /workspace

  worker-2:
    <<: *worker
    container_name: blog-worker-2
    hostname: blog-worker-2
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      BLOG_IN_DOCKER: "1"
      BLOG_WORKER_ID: "2"
    volumes:
      - type: bind
        source: ${BLOG_WORKER_HOST_ROOT:?Set BLOG_WORKER_HOST_ROOT (npm run workers:up sets this)}/worker-2
        target: /workspace

  worker-3:
    <<: *worker
    container_name: blog-worker-3
    hostname: blog-worker-3
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      BLOG_IN_DOCKER: "1"
      BLOG_WORKER_ID: "3"
    volumes:
      - type: bind
        source: ${BLOG_WORKER_HOST_ROOT:?Set BLOG_WORKER_HOST_ROOT (npm run workers:up sets this)}/worker-3
        target: /workspace

  worker-4:
    <<: *worker
    container_name: blog-worker-4
    hostname: blog-worker-4
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      BLOG_IN_DOCKER: "1"
      BLOG_WORKER_ID: "4"
    volumes:
      - type: bind
        source: ${BLOG_WORKER_HOST_ROOT:?Set BLOG_WORKER_HOST_ROOT (npm run workers:up sets this)}/worker-4
        target: /workspace

  worker-5:
    <<: *worker
    container_name: blog-worker-5
    hostname: blog-worker-5
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      BLOG_IN_DOCKER: "1"
      BLOG_WORKER_ID: "5"
    volumes:
      - type: bind
        source: ${BLOG_WORKER_HOST_ROOT:?Set BLOG_WORKER_HOST_ROOT (npm run workers:up sets this)}/worker-5
        target: /workspace

volumes:
  blog_node_modules:
