server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so host:port mapping (e.g. :3000) is preserved
    absolute_redirect off;

    # Match Firebase Hosting cleanUrls behavior
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Legacy path redirects (same as firebase.json)
    location = /politics/global-refugee-hosting-burden-2024 {
        return 301 /blog/global-refugee-hosting-burden-2024;
    }
    location = /technology/ai-gpu-packaging-memory-bottleneck-2025 {
        return 301 /blog/ai-gpu-packaging-memory-bottleneck-2025;
    }
    location = /technology/major-ai-brands-token-consumption-2022-2026 {
        return 301 /blog/major-ai-brands-token-consumption-2022-2026;
    }
    location = /economics/deflationary-growth-economies-2025 {
        return 301 /blog/deflationary-growth-economies-2025;
    }

    error_page 404 /404.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
